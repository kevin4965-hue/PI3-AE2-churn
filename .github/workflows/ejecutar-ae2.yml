name: Ejecutar notebook AE2

on:
  push:
    branches:
      - main
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write      # necesario para que el Action pueda subir el resultado

concurrency:
  group: ejecutar-ae2-main
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Borrar el resumen anterior (para comprobar que se regenera)
        run: rm -f AE2/resultados/resumen_dataframe.txt

      - name: Ejecutar AE2_exploracion_churn.ipynb
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            AE2/notebooks/AE2_exploracion_churn.ipynb

      - name: Verificar que el resumen se generó
        run: test -s AE2/resultados/resumen_dataframe.txt && head -20 AE2/resultados/resumen_dataframe.txt

      - name: Confirmar cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AE2/notebooks AE2/resultados
          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi
          git commit -m "chore: actualizar resultados de AE2 [skip ci]"
          git push origin HEAD:main
