name: Ejecutar notebooks AE2 y AE3

on:
  push:
    branches:
      - main
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write      # necesario para que el Action pueda subir el resultado

concurrency:
  group: ejecutar-ae2-main
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Borrar el resumen anterior (para comprobar que se regenera)
        run: rm -f AE2/resultados/resumen_dataframe.txt

      - name: Ejecutar AE2_exploracion_churn.ipynb
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            AE2/notebooks/AE2_exploracion_churn.ipynb

      - name: Verificar que el resumen se generó
        run: test -s AE2/resultados/resumen_dataframe.txt && head -20 AE2/resultados/resumen_dataframe.txt

      - name: Borrar los resultados anteriores de AE3 (para comprobar que se regeneran)
        run: rm -rf AE3/datos AE3/resultados

      - name: Ejecutar AE3_transformacion_churn.ipynb
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            AE3/notebooks/AE3_transformacion_churn.ipynb

      - name: Verificar que AE3 generó el dataset, las tablas y el resumen
        run: |
          test -s AE3/datos/churn_preparado.csv
          test -s AE3/resultados/resumen_dataframe_final.txt
          ls AE3/resultados/tablas/*.csv
          head -20 AE3/resultados/resumen_dataframe_final.txt

      - name: Confirmar cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AE2/notebooks AE2/resultados AE3/notebooks AE3/datos AE3/resultados
          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi
          git commit -m "chore: actualizar resultados de AE2 y AE3 [skip ci]"
          git push origin HEAD:main
